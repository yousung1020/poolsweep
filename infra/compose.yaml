# 맥북과 Pi가 함께 쓰는 기본 Compose 파일이다. Pi에서는 compose.pi.yaml이 cpuset과 메모리 제한만 덮어쓴다(#4).
# DB 정의를 한 곳에 두어 로컬에서 확인한 설정이 Pi에서도 그대로 쓰이게 한다.
name: poolsweep

services:
  db:
    # 태그는 다시 빌드되므로 다중 아키텍처 digest까지 고정한다(RESEARCH.md 6.1).
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    # PostgreSQL 설정은 이미지 기본값을 그대로 쓴다(CLAUDE.md 2장). command로 설정을 넘기지 않는다.
    environment:
      # LAN 안에서만 쓰는 실험용 계정이다(RESEARCH.md 5장).
      POSTGRES_DB: poolsweep
      POSTGRES_USER: poolsweep
      POSTGRES_PASSWORD: poolsweep
    ports:
      - "5432:5432"
    volumes:
      # 데이터 디렉터리가 비어 있을 때만 실행된다. 시드를 다시 만들려면 down -v로 볼륨까지 지운다.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # up --wait가 시드 적재가 끝난 뒤에 돌아오게 한다. 초기화 중의 임시 서버는 소켓만 열어서 -h로 TCP를 확인한다.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "poolsweep", "-d", "poolsweep"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../app
      args:
        # 값 없이 이름만 쓰면 셸에 있을 때만 전달된다. 빠뜨리면 Dockerfile의 FROM이 실패한다.
        - JDK
    environment:
      # 실험 변수는 셸에서 받는다. 값 없이 이름만 쓰면 셸에 없을 때 컨테이너에도 설정되지 않아,
      # 앱이 기동 단계에서 실패한다. 빈 문자열이 들어가 기본값으로 뜨는 일을 막으려는 것이다.
      - SPRING_PROFILES_ACTIVE
      - POOL_SIZE
      - IO_PARALLELISM
      # 접속 정보는 실험 변수가 아니므로 고정한다.
      - DB_URL=jdbc:postgresql://db:5432/poolsweep
      - DB_USER=poolsweep
      - DB_PASSWORD=poolsweep
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
